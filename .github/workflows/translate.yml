name: Auto Translate Docs

on:
  push:
    branches:
      - main  # 当你向 main 分支推送修改时触发
    paths:
      - 'README.md' # 暂时监控根目录下的 README.md 文件变动

jobs:
  translate:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 赋予 Action 自动提交并写回仓库的权限
      
    steps:
      - name: 1. 检出代码 (Checkout)
        uses: actions/checkout@v4

      # 2. 模拟翻译步骤或接入你的翻译插件/脚本
      - name: Run Translation (Demo)
        run: |
          echo "开始执行翻译逻辑..."
          # 这里可以替换为你实际调用的翻译命令或脚本

      - name: 3. 自动提交并推送更新后的文件
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "🤖 Auto-translate documentation via GitHub Actions"
          branch: main
