name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch: # 支持手动点击按钮触发编译

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 1. 拉取代码
        uses: actions/checkout@v4

      - name: 2. 设置 JDK 17 环境
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 3. 编译 Release 版本 APK
        run: |
          cd launcher
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: 4. 上传编译好的 APK 供下载
        uses: actions/upload-artifact@v4
        with:
          name: CleanYourTV-Launcher-APK
          path: launcher/app/build/outputs/apk/release/*.apk
